<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Page</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      color: #1f2933;
      background: #f4f1ea;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(90%, 640px);
      padding: 3rem;
      text-align: center;
      background: #fffdf8;
      border: 1px solid #d8d1c4;
      border-radius: 8px;
      box-shadow: 0 18px 45px rgb(54 45 34 / 12%);
    }

    h1 {
      margin-top: 0;
      color: #7c3f2c;
      font-size: clamp(2rem, 6vw, 4rem);
    }

    p {
      line-height: 1.7;
    }

    button {
      padding: 0.75rem 1.25rem;
      color: #fffdf8;
      font: inherit;
      background: #7c3f2c;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #5f3023;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome</h1>
    <p>This is a sample page for the incidents learning repository.</p>
    <button type="button" onclick="showMessage()">Say hello</button>
    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    function showMessage() {
      document.getElementById("message").textContent = "Hello from index.tml!";
    }
  </script>
</body>
</html>
